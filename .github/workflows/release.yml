name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    release:
        name: Release (${{ matrix.goos }}/${{ matrix.goarch }})
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - goos: linux
                      goarch: amd64
                      runner: ubuntu-latest

                    - goos: linux
                      goarch: arm64
                      runner: ubuntu-24.04-arm

                    - goos: windows
                      goarch: amd64
                      runner: ubuntu-latest

                    - goos: windows
                      goarch: arm64
                      runner: ubuntu-latest

                    - goos: darwin
                      goarch: amd64
                      runner: ubuntu-latest

                    - goos: darwin
                      goarch: arm64
                      runner: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js for release documentation
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: '1.26'

            - name: Install CGO deps (Linux only)
              if: matrix.goos == 'linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential libasound2-dev

            - name: Set binary extension
              id: bin
              run: |
                  if [ "${{ matrix.goos }}" = "windows" ]; then
                    echo "ext=.exe" >> $GITHUB_OUTPUT
                  else
                    echo "ext=" >> $GITHUB_OUTPUT
                  fi

            - name: Set CGO flag
              id: cgo
              run: |
                  if [ "${{ matrix.goos }}" = "linux" ]; then
                    echo "enabled=1" >> $GITHUB_OUTPUT
                  else
                    echo "enabled=0" >> $GITHUB_OUTPUT
                  fi

            - name: Build Discord bot
              env:
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
                  CGO_ENABLED: ${{ steps.cgo.outputs.enabled }}
              run: |
                  mkdir -p dist
                  go build -trimpath -ldflags="-s -w" -o dist/melodix-discord${{ steps.bin.outputs.ext }} ./cmd/discord/

            - name: Build CLI player
              env:
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
                  CGO_ENABLED: ${{ steps.cgo.outputs.enabled }}
              run: |
                  go build -trimpath -ldflags="-s -w" -o dist/melodix-cli${{ steps.bin.outputs.ext }} ./cmd/cli/

            - name: Prepare release bundle
              run: |
                  PKG_NAME="melodix-${{ matrix.goos }}-${{ matrix.goarch }}"
                  PKG_ROOT="dist/${PKG_NAME}"
                  mkdir -p "${PKG_ROOT}"
                  cp start-discord.cmd start-discord.sh start-cli.cmd start-cli.sh "${PKG_ROOT}/"
                  mkdir -p "${PKG_ROOT}/scripts"
                  cp scripts/ensure-build.cmd scripts/ensure-build.sh "${PKG_ROOT}/scripts/"
                  chmod +x "${PKG_ROOT}/"*.sh "${PKG_ROOT}/scripts/"*.sh
                  cp "dist/melodix-discord${{ steps.bin.outputs.ext }}" "${PKG_ROOT}/"
                  cp "dist/melodix-cli${{ steps.bin.outputs.ext }}" "${PKG_ROOT}/"
                  node scripts/archive-docs.mjs --destination "${PKG_ROOT}"
                  cd dist
                  zip -r "${PKG_NAME}.zip" "${PKG_NAME}"

            - name: Extract release notes from tag annotation
              id: tag
              run: |
                  git fetch --force --tags
                  {
                    echo "message<<TAG_NOTES_EOF"
                    git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}"
                    echo "TAG_NOTES_EOF"
                  } >> $GITHUB_OUTPUT

            - name: Publish release
              uses: softprops/action-gh-release@v2
              with:
                  body: ${{ steps.tag.outputs.message }}
                  files: dist/*.zip
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
