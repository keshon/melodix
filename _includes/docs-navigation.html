<aside class="docs-sidebar">
  <details id="docs-menu" open>
    <summary>Browse documentation</summary>
    <nav aria-label="Documentation">
      {% assign sections = site.data.docs | map: "section" | uniq %}
      {% for section in sections %}
      <section><h2>{{ section }}</h2><ul>
        {% for entry in site.data.docs %}{% if entry.section == section %}
        <li><a href="{{ entry.route | relative_url }}"{% if entry.source == page.path %} aria-current="page"{% endif %}>{{ entry.title }}</a></li>
        {% endif %}{% endfor %}
      </ul></section>
      {% endfor %}
    </nav>
  </details>
</aside>
