# Curated, minimal linter set — every enabled linter passes clean, so a finding
# always means something. revive's exported-docs rule is deliberately off:
# pkg/music (the library surface) is documented by hand; internal/ favors
# self-explanatory names over comment ceremony.
version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  settings:
    errcheck:
      exclude-functions:
        # Best-effort Discord UI replies. By the time one of these fails the
        # interaction it was answering is gone, so a command has nothing left to
        # do about it -- which is why adapter's helpers log the failure once,
        # centrally, and hand the error back for the few callers that do want
        # it. See the note above `reported` in adapter/reply_methods.go.
        #
        # Named by receiver, because these are methods. The entries here used to
        # name package-level functions in internal/discord/reply; that package
        # was renamed and the helpers reshaped into methods, and the exclusions
        # were left pointing at paths that no longer resolve -- which silently
        # unexcluded all 28 call sites at once.
        - (*github.com/keshon/melodix/internal/discord/adapter.SlashInteractionContext).FollowupEphemeral
        - (*github.com/keshon/melodix/internal/discord/adapter.ComponentInteractionContext).FollowupEphemeral
        - (github.com/keshon/melodix/internal/discord/adapter.Interaction).FollowupEphemeral
        # Idiomatic deferred cleanup where the error has no consumer.
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*github.com/godeps/opus.Encoder).Reset
        - (*github.com/keshon/melodix/pkg/music/stream.RecoveryStream).Close
        - (*github.com/keshon/melodix/pkg/music/sink.SpeakerProvider).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt

issues:
  # Report every finding, not the first three of each kind. The default caps at
  # max-same-issues: 3, which is how a run that had 28 unchecked replies
  # reported 8 -- fixing exactly what CI printed would have left twenty behind
  # and gone red again on the next push. This set is curated to pass clean, so
  # a truncated count is never the useful number.
  max-same-issues: 0
  max-issues-per-linter: 0
